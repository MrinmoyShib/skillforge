name: SkillForge CI / Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Quality Gates: Pytest Suite & Django System Checks
  # ============================================================================
  backend-ci:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillforge
          POSTGRES_USER: skillforge
          POSTGRES_PASSWORD: skillforge_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Run Ruff Linter
        run: pip install ruff && ruff check backend/apps/

      - name: Run Dependency Audit
        run: pip install pip-audit && pip-audit -r backend/requirements/base.txt

      - name: Run Django System Check
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ci-secret-key-skillforge-testing-only-12345
          DATABASE_URL: postgres://skillforge:skillforge_dev_password@localhost:5432/skillforge
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: python manage.py check

      - name: Apply Migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ci-secret-key-skillforge-testing-only-12345
          DATABASE_URL: postgres://skillforge:skillforge_dev_password@localhost:5432/skillforge
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Run Pytest Test Suite
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          SECRET_KEY: ci-secret-key-skillforge-testing-only-12345
          DATABASE_URL: postgres://skillforge:skillforge_dev_password@localhost:5432/skillforge
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest apps/ -v --create-db

  # ============================================================================
  # 2. Frontend Quality Gates: Clean NPM Install & Production Build
  # ============================================================================
  frontend-ci:
    name: Frontend Build & Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci --include=optional

      - name: Run NPM Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Rebuild Tailwind native binding
        working-directory: frontend
        run: npm rebuild @tailwindcss/oxide

      - name: Verify Production Build
        working-directory: frontend
        run: npm run build

      # Note: Frontend tests can be added here when test files exist
