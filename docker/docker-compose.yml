version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: skillforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillforge
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge -d skillforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillforge-net

  redis:
    image: redis:7-alpine
    container_name: skillforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skillforge-net

  django:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: skillforge-django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skillforge-net

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: skillforge-celery
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ../backend:/app
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skillforge-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: skillforge-frontend
    restart: unless-stopped
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - skillforge-net

volumes:
  postgres-data:

networks:
  skillforge-net:
    driver: bridge
    name: skillforge-net
