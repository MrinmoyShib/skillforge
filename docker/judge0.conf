# Judge0 Configuration
# https://github.com/judge0/judge0

# PostgreSQL
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0_user
POSTGRES_PASSWORD=judge0_dev_password

# Redis
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_redis_password

# Authentication
AUTHN_HEADER=X-Auth-Token
AUTH_TOKEN=skillforge-judge0-dev-token

# Sandbox Limits
CPU_TIME_LIMIT=2.0
MAX_CPU_TIME_LIMIT=10.0
CPU_EXTRA_TIME=1.0
MAX_CPU_EXTRA_TIME=5.0
WALL_TIME_LIMIT=5.0
MAX_WALL_TIME_LIMIT=20.0
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=524288
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120
ENABLE_PER_PROCESS_AND_RATIO_MEMORY_LIMIT=false
MAX_FILE_SIZE=4096
MAX_MAX_FILE_SIZE=8192

# Security
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# Workers
RAILS_MAX_THREADS=8
SIDEKIQ_CONCURRENCY=2
